services:
  db:
    image: postgres:17-alpine
    container_name: plusone-db
    environment:
      POSTGRES_USER: plusone
      POSTGRES_PASSWORD: plusone
      POSTGRES_DB: plusone
    ports:
      - "5432:5432"
    volumes:
      - plusone-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plusone"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  plusone-db:
